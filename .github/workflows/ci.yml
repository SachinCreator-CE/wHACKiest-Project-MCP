name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No real AWS access key IDs in the repo
        run: |
          # Only obviously fake keys (containing EXAMPLE, like AWS's documented AKIAIOSFODNN7EXAMPLE) may appear.
          if git grep --untracked -noE 'AKIA[0-9A-Z]{16}' | grep -v EXAMPLE; then
            echo "::error::Possible real AWS access key ID committed (only keys containing EXAMPLE are allowed)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Tests (offline, no AWS, no network)
        env:
          SENTINEL_MODE: offline
          SENTINEL_NO_DOTENV: "1"
        run: pytest -q
